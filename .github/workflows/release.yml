name: Release

# Publishes four artifacts to a draft GitHub Release:
#   Windows  - NSIS installer
#   macOS    - .dmg for Apple silicon
#   Linux    - .tar.gz and a Flatpak bundle
# Push a `v*` tag for a real release, or run it by hand for a throwaway `dev-N`
# prerelease. The release stays a draft; publish it once the assets look right.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0

jobs:
  # Creates the draft release once, up front, so the build jobs below only
  # upload to it instead of racing to create it.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag and release notes
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
            # This version's section of docs/RELEASES.md, without its heading.
            notes=$(awk -v h="## $tag" 'index($0, h) == 1 { on = 1; next } on && /^---$/ { exit } on' docs/RELEASES.md)
            if [[ -z "${notes//[[:space:]]/}" ]]; then
              echo "::error::docs/RELEASES.md has no '## $tag' section - write the release notes before tagging."
              exit 1
            fi
            # Relative links to sibling docs would break on the Releases page.
            notes=${notes//](ROADMAP.md)/](https://github.com/$GITHUB_REPOSITORY/blob/master/docs/ROADMAP.md)}
          else
            tag="dev-$GITHUB_RUN_NUMBER"
            prerelease=true
            notes="Test build of $GITHUB_SHA."
          fi
          { echo "tag=$tag"; echo "prerelease=$prerelease"; echo "notes<<NOTES_EOF"; echo "$notes"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          # Re-running a failed workflow finds the release already there.
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          flags=(--draft --title "App Launcher $TAG" --notes "$NOTES")
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          [[ "$GITHUB_REF" != refs/tags/* ]] && flags+=(--target "$GITHUB_SHA")
          gh release create "$TAG" "${flags[@]}"

  # Windows and macOS go through the Tauri bundler, one installer format each:
  # NSIS alone (no WiX/MSI, which downloads and runs a second toolchain), and a
  # .dmg on the arm64 runner, which is Apple silicon natively.
  installer:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseName: "App Launcher ${{ needs.release.outputs.tag }}"
          releaseBody: ${{ needs.release.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          args: --bundles ${{ matrix.bundles }}

  # A plain binary in a tarball: no Tauri bundler, no AppImage/deb/rpm tooling.
  linux-tarball:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release --locked --features custom-protocol

      - name: Package
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          name="app-launcher-$TAG-linux-x86_64"
          mkdir "$name"
          install -m755 src-tauri/target/release/app-launcher "$name/app-launcher"
          install -m644 packaging/linux/app-launcher.desktop packaging/linux/README.txt LICENSE "$name/"
          install -m644 src-tauri/icons/icon.png "$name/app-launcher.png"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          files: ${{ env.ASSET }}

  flatpak:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: app-launcher.flatpak
          manifest-path: packaging/flatpak/dev.d7.app-launcher.json
          cache: false

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
          files: app-launcher.flatpak
