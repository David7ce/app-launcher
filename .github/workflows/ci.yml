name: CI

# release.yml only runs on version tags, so a compile break on master (e.g. a
# Windows-only function called without a cfg stub) went unnoticed until the
# next release. This runs on every push and PR instead.
# Docs-only changes can't break a build, so they skip it; and a newer push
# cancels the run it superseded instead of queueing behind it.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only master writes the cache; PR runs read it but don't churn it.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # --locked also catches a Cargo.toml edit committed without its Cargo.lock,
      # which is what broke the first v0.2.0 release build.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Catalog/scan tests
        run: python -m unittest discover -s tools/tests

      # The Flatpak builds offline from this list, so it must track Cargo.lock.
      - name: Flatpak cargo-sources.json matches Cargo.lock
        run: |
          pip install --quiet aiohttp PyYAML tomlkit
          curl -sSfL -o /tmp/generator.py https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/f03a673abe6ce189cea1c2857e2b44af2dd79d1f/cargo/flatpak-cargo-generator.py
          python /tmp/generator.py src-tauri/Cargo.lock -o /tmp/cargo-sources.json
          diff /tmp/cargo-sources.json packaging/flatpak/cargo-sources.json

  # src/main.js under jsdom with a stubbed Tauri bridge: the pills, column layout,
  # editor, override migration and icon fallback. Test-only; nothing here ships.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/tests/frontend/package-lock.json
      - run: npm ci
        working-directory: tools/tests/frontend
      - run: npm test
        working-directory: tools/tests/frontend
