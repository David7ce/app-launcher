[package]
name = "app-launcher"
version = "0.2.0"
description = "Categorized home dashboard for launching installed desktop apps"
authors = ["David7ce"]
license = "MIT"
repository = "https://github.com/David7ce/app-launcher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
which = "6"

# Windows-only: resolve apps the registry knows about but $PATH doesn't.
# `which` covers PATH + PATHEXT; the registry's App Paths key is how most
# GUI installers (Office, VLC, Inkscape) register themselves for `Run`
# dialog / `start` lookup, and is invisible to a PATH search.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
