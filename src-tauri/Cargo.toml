[package]
name = "app-launcher"
version = "0.3.0"
description = "Categorized home dashboard for launching installed desktop apps"
authors = ["David7ce"]
license = "MIT"
repository = "https://github.com/David7ce/app-launcher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# A plain library for main.rs to call. The mobile template also builds a
# staticlib and a cdylib; this is desktop-only, so they would only add build time.
[lib]
name = "app_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = "2.11.3"
which = "6"
# Encodes a fallback icon as a data: URL for the frontend (all OSes).
base64 = "0.22"

# Set by `cargo tauri build`; needed when building the binary with plain cargo
# (the Linux tarball and the Flatpak) so it serves its embedded frontend.
[features]
custom-protocol = ["tauri/custom-protocol"]

# The app is a thin shell over the OS, so favour a small binary over speed.
[profile.release]
opt-level = "s"
strip = true
panic = "abort"

# Windows-only: resolve apps the registry knows about but $PATH doesn't.
# `which` covers PATH + PATHEXT; the registry's App Paths key is how most
# GUI installers (Office, VLC, Inkscape) register themselves for `Run`
# dialog / `start` lookup, and is invisible to a PATH search.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
