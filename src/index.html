<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <input id="search" type="search" placeholder="Search apps…" autocomplete="off" />
    <div class="header-actions">
      <button id="cli-toggle" type="button" aria-pressed="true" hidden>⌨ CLI Tools</button>
      <button id="edit-toggle" type="button">✎ Edit</button>
    </div>
  </header>
  <div id="error-banner" hidden></div>
  <div id="layout">
    <aside id="cli-panel" aria-label="CLI Tools" hidden></aside>
    <main id="categories"></main>
  </div>
  <script src="main.js"></script>
</body>
</html>
