<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="pills" role="group" aria-label="Show">
      <button class="pill" type="button" data-view="all">All<span class="count"></span></button>
      <button class="pill" type="button" data-view="gui">GUI<span class="count"></span></button>
      <button class="pill" type="button" data-view="cli">CLI<span class="count"></span></button>
    </div>
    <input id="search" type="search" placeholder="Search apps…" autocomplete="off" />
    <div class="header-actions">
      <button id="edit-toggle" type="button">✎ Edit</button>
    </div>
  </header>
  <div id="error-banner" hidden></div>
  <main id="categories"></main>
  <div id="messages"></div>
  <script src="main.js"></script>
</body>
</html>
